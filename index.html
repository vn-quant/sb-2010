<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>20/10 — Countdown & Envelope</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    canvas{position:fixed;inset:0;display:block}

    /* Morph dots above matrix */
    #morph{position:fixed;inset:0;z-index:5;pointer-events:none}

    /* Fade-to-black between phases */
    #blackout{
      position:fixed;inset:0;background:#000;opacity:0;
      transition:opacity .7s ease;z-index:10040;pointer-events:none
    }
    #blackout.is-visible{opacity:1}

    /* Fireworks behind envelope */
    #fireworks-layer{position:fixed;inset:0;z-index:10045;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <canvas id="morph"></canvas>
  <div id="blackout"></div>
  <div id="fireworks-layer"></div>

  <!-- Phase 1: rain + morph -->
  <script src="./matrix.js"></script>
  <script src="./text-morph.js"></script>
  <script src="./blackout.js"></script>

  <!-- Fireworks library + init (exposes startFireworks) -->
  <script src="https://unpkg.com/fireworks-js@2.10.6/dist/index.umd.js"></script>
  <script src="./fireworks-init.js"></script>

  <!-- Envelope (injects its own mount; ensure its mount background is transparent) -->
  <script src="./envelope.js"></script>

  <!-- Sync fireworks to envelope reveal -->
  <script>
    (function () {
      const prev = window.showEnvelope3D;
      window.showEnvelope3D = function () {
        prev && prev();
        window.startFireworks && window.startFireworks(10000);
      };
    })();
  </script>
</body>
</html>
