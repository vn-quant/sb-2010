<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>20/10 — Countdown & Envelope</title>
  <style>
    :root {
      --z-morph: 5;
      --z-blackout: 10040;
      --z-fireworks: 10045; /* behind envelope */
    }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; overflow: hidden;
      -webkit-text-size-adjust: none;
      touch-action: none;
    }
    canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
    }

    /* Morph dots above matrix */
    #morph {
      z-index: var(--z-morph);
      pointer-events: none;
    }

    /* Fade-to-black between phases */
    #blackout {
      position: fixed; inset: 0; background: #000;
      opacity: 0; transition: opacity .7s ease;
      z-index: var(--z-blackout); pointer-events: none;
    }
    #blackout.is-visible { opacity: 1; }

    /* Fireworks behind envelope */
    #fireworks-layer {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: var(--z-fireworks); pointer-events: none;
    }

    /* Suggest landscape for best view */
    @media (orientation: portrait) {
      body::before {
        content: "Rotate your phone for the best view 🌸";
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: #000; color: #fff; text-align: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        font-size: clamp(16px, 3.4vw, 20px);
        z-index: 20000;
      }
    }
  </style>
</head>
<body>
  <!-- Background canvases -->
  <canvas id="matrix"></canvas>
  <canvas id="morph"></canvas>

  <!-- Transition & fireworks layers -->
  <div id="blackout"></div>
  <div id="fireworks-layer"></div>

  <!-- Phase 1 scripts -->
  <script src="./matrix.js"></script>
  <script src="./text-morph.js"></script>
  <script src="./blackout.js"></script>

  <!-- Fireworks library + your existing init -->
  <script src="https://unpkg.com/fireworks-js@2.10.6/dist/index.umd.js"></script>
  <script src="./fireworks-init.js"></script>

  <!-- Envelope (injects its own mount; make sure its background is transparent) -->
  <script src="./envelope.js"></script>

  <!-- Hook fireworks to envelope reveal -->
  <script>
    (function () {
      const prev = window.showEnvelope3D;
      window.showEnvelope3D = function () {
        prev && prev();
        // Start fireworks forever (0 = infinite)
        window.startFireworks && window.startFireworks(0);
      };
    })();
  </script>
</body>
</html>
