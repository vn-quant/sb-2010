<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>20/10 — Countdown & Envelope</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- The whole experience lives inside #stage so we can rotate/scale it -->
  <div id="stage">
    <canvas id="matrix"></canvas>
    <canvas id="morph"></canvas>
    <div id="blackout"></div>
    <div id="fireworks-layer"></div>
  </div>

  <!-- Optional hint overlay while we rotate/fit -->
  <div id="orient-hint">Rotating for best view…</div>

  <!-- Phase 1 -->
  <script src="./matrix.js"></script>
  <script src="./text-morph.js"></script>
  <script src="./blackout.js"></script>

  <!-- Fireworks -->
  <script src="https://unpkg.com/fireworks-js@2.10.6/dist/index.umd.js"></script>
  <script src="./fireworks-init.js"></script>

  <!-- Envelope (make sure its mount background is transparent in envelope.js) -->
  <script src="./envelope.js"></script>

  <!-- Auto-rotate & scale to fit phones -->
  <script src="./rotate-fit.js"></script>

  <!-- Start fireworks when envelope shows (forever) -->
  <script>
    (function () {
      const prev = window.showEnvelope3D;
      window.showEnvelope3D = function () {
        prev && prev();
        window.startFireworks && window.startFireworks(0); // 0 = infinite
      };
    })();
  </script>
</body>
</html>
